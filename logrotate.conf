# Personal logrotate configuration for maintenance scripts

# Rotate the main script's log files (will implement dated logs in Day 2)
# This pattern anticipates logs like logs/maintenance_YYYYMMDD_HHMMSS.log
/home/youruser/maintenance-scripts/logs/maintenance_*.log { # <-- **CHANGE /home/youruser/ TO YOUR ACTUAL HOME PATH**
  daily             # Rotate daily
  rotate 7          # Keep 7 old copies
  compress          # Compress old copies
  missingok         # Don't exit with error if the log file is missing
  notifempty        # Don't rotate if the log file is empty
  # If the log file is created by the script running as your user,
  # logrotate might need permission to recreate it. Uncomment the
  # 'create' line if you encounter issues, adjusting user/group.
  # create 644 youruser youruser 
}

# Rotate the daily report files
/home/youruser/maintenance-scripts/logs/daily-report-*.txt { # <-- **CHANGE /home/youruser/**
  weekly # Rotate weekly
  rotate 4 # Keep 4 old reports
  compress
  missingok
  notifempty
  dateext # Use date in the rotated file name (e.g., .txt-YYYYMMDD.gz)
}

# Add rotation for the cron execution log (will add in Day 2)
/home/youruser/maintenance-scripts/logs/maint_cron.log { # <-- **CHANGE /home/youruser/**
   daily
   rotate 7
   compress
   missingok
   notifempty
   size 1M # Rotate if it gets too big, even if not daily
}

# Add other log files here if you want to manage them personally
